<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마인크래프트 키보드·마우스 연습</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f7ee;--card:#fff;--ink:#23301c;--sub:#5b6b50;--accent:#4c9a2a;--accent-ink:#fff;--warn:#fff3cd;--warn-ink:#7a5200;--bad:#d64545;--line:#cfdcc3;--grass:#7cc45a;--dirt:#8a5a35;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1a2216;--card:#243020;--ink:#eef5e8;--sub:#a9bb9d;--accent:#6cc04a;--accent-ink:#10200a;--warn:#4a3a10;--warn-ink:#ffe08a;--bad:#ff7a7a;--line:#3b4d34;--grass:#4f8a38;--dirt:#a06a40;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1a2216;--card:#243020;--ink:#eef5e8;--sub:#a9bb9d;--accent:#6cc04a;--accent-ink:#10200a;--warn:#4a3a10;--warn-ink:#ffe08a;--bad:#ff7a7a;--line:#3b4d34;--grass:#4f8a38;--dirt:#a06a40;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:820px;padding:16px}
h1{font-size:1.5rem;margin:8px 0 12px;text-align:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.guide{background:var(--warn);color:var(--warn-ink);border-color:var(--warn-ink)}
.guide h2{margin:0 0 6px;font-size:1.15rem}
.guide p{margin:4px 0;line-height:1.55}
.bar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.prog{height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.big{font-size:3.6rem;font-weight:800;text-align:center;margin:8px 0 2px;min-height:1.2em}
.desc{text-align:center;font-size:1.15rem;color:var(--sub);min-height:1.5em}
#fb{text-align:center;font-weight:700;color:var(--accent);min-height:1.4em}
#lang{display:none;background:var(--bad);color:#fff;padding:10px;border-radius:10px;text-align:center;font-weight:700;margin-top:8px}
#arena{display:none;position:relative;height:240px;margin-top:10px;border:3px dashed var(--line);border-radius:12px;background:linear-gradient(var(--card) 60%,var(--grass) 60%);overflow:hidden;cursor:crosshair;user-select:none}
#arena .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-weight:700;pointer-events:none}
#tg{position:absolute;width:58px;height:58px;border-radius:8px}
#tg.blk{background:linear-gradient(var(--grass) 25%,var(--dirt) 25%);border:3px solid #0003}
#tg.star{border-radius:50%;background:#ffd23f;display:flex;align-items:center;justify-content:center;font-size:2rem}
#hot{display:none;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.slot{width:46px;height:46px;border:3px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--card)}
.slot.sel{border-color:var(--ink);background:var(--accent);color:var(--accent-ink)}
.slot.tg{outline:3px dashed var(--bad);outline-offset:2px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.key{border:2px solid var(--line);border-bottom-width:5px;border-radius:10px;padding:8px 4px;text-align:center;font-weight:700;background:var(--card);font-size:.95rem}
.key small{display:block;font-weight:400;color:var(--sub);font-size:.7rem;margin-top:2px}
.key.hint{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);animation:p 1s infinite}
.key.hint small{color:var(--accent-ink)}
@keyframes p{50%{transform:translateY(3px)}}
.flash-ok{animation:ok .3s}.flash-bad{animation:bad .3s}
@keyframes ok{50%{transform:scale(1.06);color:var(--accent)}}
@keyframes bad{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
button{font:inherit;font-weight:700;padding:12px 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
label{display:flex;gap:6px;align-items:center;color:var(--sub)}
#end{display:none;text-align:center}
</style>
</head>
<body>
<main>
<h1>⛏️ 마인크래프트 키보드·마우스 연습</h1>

<div class="card guide">
<h2>⚠️ 한/영 키를 꼭 기억해요!</h2>
<p>키보드를 눌렀는데 <b>글자가 한글(ㅈ, ㅁ, ㄴ, ㅇ)</b>로 나오거나 <b>캐릭터가 움직이지 않으면</b> 한글 상태예요.</p>
<p>👉 스페이스바 옆의 <b>[한/영]</b> 키를 한 번 눌러서 <b>영어 상태</b>로 바꿔요. 그러면 W, A, S, D로 다시 움직여요!</p>
</div>

<div class="card" id="game">
<div class="bar"><span id="count">0 / 15</span><span id="score">⭐ 0</span></div>
<div class="prog"><i id="pg"></i></div>
<div class="big" id="target">준비!</div>
<div class="desc" id="desc">연습 방법을 골라 시작해요</div>
<div id="fb"></div>
<div id="lang">한글 상태예요! [한/영] 키를 눌러 영어로 바꿔요</div>
<div id="arena"><div class="t" id="at"></div></div>
<div id="hot"></div>
<div class="row">
<button onclick="begin('key')">⌨️ 키보드 연습</button>
<button onclick="begin('mouse')">🖱️ 마우스 연습</button>
<button onclick="begin('all')">🎮 섞어서 도전</button>
</div>
<div class="row"><label><input type="checkbox" id="hint" checked> 힌트 보기</label>
<button class="alt" id="hanbtn">한/영 키가 없어요 (눌렀어요)</button></div>
</div>

<div class="card" id="end">
<div class="big" id="res"></div>
<div class="desc" id="msg"></div>
<div class="row"><button onclick="begin(mode)">다시 하기</button></div>
</div>

<div class="card"><b>조작 한눈에 보기</b><div class="keys" id="keys" style="margin-top:10px"></div></div>
</main>
<script>
function C(a){return function(e){return a.indexOf(e.code)>-1}}
var T=[
{k:'esc',t:'Esc',d:'메뉴 닫기 · 설정과 조작 바꾸기',type:'key',m:C(['Escape'])},
{k:'f1',t:'F1',d:'슬롯 포인터 보이기 / 감추기',type:'key',m:C(['F1'])},
{k:'f5',t:'F5',d:'시점 바꾸기 (1인칭 ↔ 3인칭)',type:'key',m:C(['F5'])},
{k:'num',t:'1~9',d:'퀵슬롯 선택 · 아이템 고르기',type:'key'},
{k:'q',t:'Q',d:'아이템 버리기 (들고 있는 것 던지기)',type:'key',m:C(['KeyQ'])},
{k:'w',t:'W',d:'앞으로 가기',type:'key',m:C(['KeyW'])},
{k:'a',t:'A',d:'왼쪽으로 가기',type:'key',m:C(['KeyA'])},
{k:'s',t:'S',d:'뒤로 가기',type:'key',m:C(['KeyS'])},
{k:'d',t:'D',d:'오른쪽으로 가기',type:'key',m:C(['KeyD'])},
{k:'run',t:'W W',d:'W를 빠르게 두 번 누르면 달리기!',type:'key',dbl:'KeyW'},
{k:'ctrl',t:'Ctrl',d:'WASD와 같이 누르면 빨리 이동',type:'key',m:C(['ControlLeft','ControlRight'])},
{k:'shift',t:'Shift',d:'엎드리기 · 날면서 누르면 아래로 내려가요',type:'key',m:C(['ShiftLeft','ShiftRight'])},
{k:'space',t:'스페이스바',d:'점프!',type:'key',m:C(['Space'])},
{k:'fly',t:'스페이스바 ×2',d:'두 번 빠르게 누르면 날 수 있어요',type:'key',dbl:'Space'},
{k:'t',t:'T',d:'채팅창 열기 · 글자로 이야기해요',type:'key',m:C(['KeyT'])},
{k:'enter',t:'Enter',d:'채팅창 열기 · 보내기',type:'key',m:C(['Enter','NumpadEnter'])},
{k:'han',t:'한/영',d:'한글 ↔ 영어 바꾸기',type:'key',m:function(e){return e.code==='Lang1'||e.key==='HangulMode'||e.keyCode===21}},
{k:'left',t:'🖱️ 왼쪽 클릭',d:'블록 부수기 · 공격하기',type:'mouse'},
{k:'right',t:'🖱️ 오른쪽 클릭',d:'블록 놓기 · 아이템 쓰기',type:'mouse'},
{k:'wheel',t:'🖱️ 휠 돌리기',d:'퀵슬롯 바꾸기',type:'mouse'},
{k:'move',t:'🖱️ 마우스 움직이기',d:'시선 이동 (두리번)',type:'mouse'}
];
var TOTAL=15,cur=null,last=null,n=0,sc=0,run=false,mode='all',sel=1,dblT=0,wT=0;
var $=function(i){return document.getElementById(i)};
var ar=$('arena');
T.forEach(function(k){var d=document.createElement('div');d.className='key';d.id='k-'+k.k;d.innerHTML=k.t+'<small>'+k.d+'</small>';$('keys').appendChild(d)});
for(var i=1;i<=9;i++){var s=document.createElement('div');s.className='slot';s.id='s'+i;s.textContent=i;$('hot').appendChild(s)}
function flash(el,c){el.classList.remove('flash-ok','flash-bad');void el.offsetWidth;el.classList.add(c)}
function fb(m){$('fb').textContent=m||''}
function hot(){for(var i=1;i<=9;i++){var s=$('s'+i);s.className='slot'+(i===sel?' sel':'')+(cur&&cur.n===i?' tg':'')}}
function hint(){T.forEach(function(k){$('k-'+k.k).classList.remove('hint')});if(cur&&$('hint').checked)$('k-'+cur.k).classList.add('hint')}
function rnd(a){return Math.floor(Math.random()*a)}
function begin(m){
  mode=m;n=0;sc=0;last=null;run=true;
  $('end').style.display='none';$('game').style.display='block';$('score').textContent='⭐ 0';next();
}
function next(){
  if(n>=TOTAL)return finish();
  var pool=T.filter(function(x){return mode==='all'||x.type===mode}),k;
  do{k=pool[rnd(pool.length)]}while(last&&k.k===last);
  last=k.k;n++;cur=Object.assign({},k);dblT=0;fb('');
  if(k.k==='num'){cur.n=1+rnd(9);cur.t='숫자 '+cur.n;cur.d='퀵슬롯 '+cur.n+'번 고르기'}
  if(k.k==='wheel'){cur.n=1+rnd(9);cur.d='휠을 위아래로 돌려 '+cur.n+'번 슬롯 고르기'}
  $('target').textContent=cur.t;$('desc').textContent=cur.d;
  $('count').textContent=n+' / '+TOTAL;$('pg').style.width=((n-1)/TOTAL*100)+'%';
  var needHot=cur.n>0;
  if(needHot){do{sel=1+rnd(9)}while(sel===cur.n)}
  $('hot').style.display=needHot?'flex':'none';hot();
  var mouse=cur.type==='mouse';ar.style.display=mouse?'block':'none';
  var old=$('tg');if(old)old.remove();
  $('at').textContent=cur.k==='wheel'?'여기에서 휠을 돌려요':'';
  if(mouse&&cur.k!=='wheel'){
    var t=document.createElement('div');t.id='tg';
    t.className=cur.k==='move'?'star':'blk';if(cur.k==='move')t.textContent='⭐';
    t.style.left=rnd(ar.clientWidth-70)+'px';t.style.top=rnd(ar.clientHeight-70)+'px';
    if(cur.k==='move')t.onmouseenter=function(){if(run&&cur.k==='move')ok()};
    ar.appendChild(t);
  }
  hint();
}
function ok(){sc++;$('score').textContent='⭐ '+sc;flash($('target'),'flash-ok');$('lang').style.display='none';next()}
function bad(m){flash($('target'),'flash-bad');if(m)fb(m)}
function finish(){
  run=false;cur=null;hint();$('pg').style.width='100%';
  $('game').style.display='none';$('end').style.display='block';
  $('res').textContent='⭐ '+sc+' / '+TOTAL;
  $('msg').textContent=sc>=TOTAL?'완벽해요! 마인크래프트 준비 끝! 🎉':'잘했어요! 한 번 더 해 볼까요?';
}
function match(e){
  if(cur.k==='num')return e.code==='Digit'+cur.n||e.code==='Numpad'+cur.n;
  if(cur.dbl)return e.code===cur.dbl;
  return cur.m(e);
}
document.addEventListener('keydown',function(e){
  if(e.repeat)return;
  if(run)e.preventDefault();
  if(!run||!cur||cur.type!=='key')return;
  if(/^Key[A-Z]$/.test(e.code)&&e.key&&/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(e.key))$('lang').style.display='block';
  if(!match(e)){dblT=0;return bad()}
  if(cur.dbl){
    var now=Date.now();
    if(dblT&&now-dblT<600)return ok();
    dblT=now;return fb('좋아요! 빠르게 한 번 더!');
  }
  ok();
});
ar.addEventListener('contextmenu',function(e){e.preventDefault()});
ar.addEventListener('mousedown',function(e){
  if(!run||!cur||(cur.k!=='left'&&cur.k!=='right'))return;
  if(e.target.id!=='tg')return;
  var want=cur.k==='left'?0:2;
  if(e.button===want)ok();else bad(cur.k==='left'?'왼쪽 버튼으로 눌러요!':'오른쪽 버튼으로 눌러요!');
});
ar.addEventListener('wheel',function(e){
  if(!run||!cur||cur.k!=='wheel')return;
  e.preventDefault();
  var now=Date.now();if(now-wT<120)return;wT=now;
  sel+=e.deltaY>0?1:-1;if(sel>9)sel=1;if(sel<1)sel=9;
  hot();if(sel===cur.n)setTimeout(ok,150);
},{passive:false});
$('hint').onchange=hint;
$('hanbtn').onclick=function(){if(run&&cur&&cur.k==='han')ok()};
</script>
</body>
</html>
