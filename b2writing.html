  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body { background: #fff8e9; color: #24334a; }
    button { cursor: pointer; }
    button:focus-visible { outline: 4px solid #345ee5; outline-offset: 4px; }
    .app { width: min(100%, 1120px); min-height: 100svh; margin: auto; padding: clamp(14px, 2.5vh, 28px) clamp(16px, 3vw, 36px); display: flex; flex-direction: column; gap: clamp(10px, 2vh, 22px); }

    .progress-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .progress-track { width: clamp(76px, 11vw, 140px); height: 9px; background: #e3e9f6; border-radius: 20px; overflow: hidden; }
    .progress-fill { width: 0; height: 100%; background: #6989e2; border-radius: inherit; transition: width .35s ease; }
    .star-count { color: #95681a; font-weight: 800; white-space: nowrap; }
    .star-toast { position: fixed; top: 72px; left: 50%; transform: translate(-50%, -8px); z-index: 10; padding: 12px 20px; border-radius: 18px; background: #fff6d7; border: 2px solid #efd688; box-shadow: 0 6px 20px #24334a1c; color: #604a19; font-weight: 800; text-align: center; pointer-events: none; opacity: 0; transition: opacity .35s ease, transform .35s ease; }
    .star-toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .completion-stats { font-size: clamp(18px, 2.2vw, 24px); font-weight: 800; color: #3559b7; }
    .completion-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; width: 100%; }
    .completion-actions .action { padding: 12px 24px; }
    @media (prefers-reduced-motion: reduce) { .progress-fill, .star-toast { transition: none; } }
    .workspace { flex: 1; min-height: 300px; display: flex; flex-direction: column; }
    .selection, .celebration { flex: 1; min-height: 300px; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; background: #fff; border: 4px solid #e8e6dc; border-radius: 32px; padding: clamp(20px, 4vw, 48px); box-shadow: 0 8px 0 #eee8d8; }
    .selection h2, .celebration h2 { margin: 0 0 12px; font-size: clamp(27px, 4vw, 46px); letter-spacing: -.05em; }
    .selection p { margin: 0 0 30px; color: #66748a; font-size: clamp(16px, 2vw, 22px); }
    .choices { width: min(100%, 760px); display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    .choices.three { grid-template-columns: repeat(3, 1fr); }
    .choice { min-height: 125px; border: 3px solid #dce5fa; border-radius: 24px; background: #f6f9ff; color: #304b8c; font-size: clamp(21px, 2.6vw, 29px); font-weight: 800; box-shadow: 0 5px 0 #dce5fa; }
    .choice:hover { background: #eaf1ff; }
    .choice:active, .action:active { transform: translateY(3px); box-shadow: 0 2px 0 #dcdfe5; }
    .practice-layout { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
    .sentence-prompt { padding: 18px 26px; background: #fff; border: 3px solid #e8e6dc; border-radius: 24px; text-align: center; font-size: clamp(24px, 3vw, 38px); font-weight: 800; line-height: 1.45; word-break: keep-all; }
    .practice { position: relative; flex: 1; min-height: 300px; overflow: hidden; background: #fff; border: 4px solid #e8e6dc; border-radius: 32px; box-shadow: 0 8px 0 #eee8d8; touch-action: none; user-select: none; -webkit-user-select: none; }
    .practice::before, .practice::after { content: ""; position: absolute; z-index: 0; pointer-events: none; }
    .practice::before { top: 50%; left: 5%; right: 5%; border-top: 2px dashed #f0eee9; }
    .practice::after { top: 7%; bottom: 7%; left: 50%; border-left: 2px dashed #f0eee9; }
    .practice.sentence::after { display: none; }
    .practice.sentence::before { top: 63%; }
    .guide { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; padding: 12px; color: transparent; -webkit-text-stroke: 3px #d5d9de; font-size: clamp(190px, min(49vw, 53vh), 480px); font-weight: 900; line-height: 1; white-space: nowrap; pointer-events: none; }
    .guide.word { font-size: clamp(90px, min(18vw, 35vh), 230px); letter-spacing: -.08em; }
    canvas { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    .tool-row { display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; padding: 6px 0; }
    .tool-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tool-label { margin-right: 5px; font-weight: 800; color: #66748a; }
    .tool { min-height: 52px; min-width: 90px; padding: 8px 14px; border: 2px solid #dce5fa; border-radius: 16px; background: #fff; color: #30405b; font-size: 17px; font-weight: 800; }
    .tool.selected { background: #dce8ff; border-color: #2853ba; color: #173d99; box-shadow: inset 0 0 0 2px #2853ba; }
    .color-tool { min-width: 54px; width: 54px; padding: 6px; }
    .color-dot { display: block; width: 25px; height: 25px; border-radius: 50%; margin: auto; border: 1px solid #66748a; }
    .confirm-box { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 10px; border: 2px solid #e8c76c; border-radius: 16px; background: #fff8df; font-weight: 800; }
    .confirm-box .tool { min-height: 44px; }
    @media (max-width: 900px) and (orientation: landscape) { .app { gap: 8px; } .tool-row { gap: 6px 12px; } .tool { min-height: 44px; padding: 5px 10px; } .action { min-height: 54px; } .sentence-prompt { padding: 8px 20px; } }
    @media (max-width: 620px) { .tool-row { gap: 8px; } .tool-group { width: 100%; } .tool { min-width: 75px; font-size: 15px; } }
    .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(9px, 1.6vw, 18px); padding-bottom: 5px; }
    .action { min-height: clamp(66px, 10vh, 90px); border: 0; border-radius: 22px; background: #fff; color: #30405b; box-shadow: 0 5px 0 #dcdfe5; font-size: clamp(18px, 2.2vw, 26px); font-weight: 800; }
    .action:disabled { opacity: .45; cursor: not-allowed; }
    .next { background: #ffcc4d; color: #423410; box-shadow: 0 5px 0 #dfa727; }
    .next:active { box-shadow: 0 2px 0 #dfa727; }
    .celebration .star { font-size: clamp(70px, 11vw, 130px); line-height: 1.2; }

    .hidden { display: none !important; }
    @media (max-width: 620px) {

      .guide.word { font-size: clamp(75px, 18vw, 150px); }
      .choices, .choices.three { grid-template-columns: 1fr; }
      .choice { min-height: 75px; }
      .actions { grid-template-columns: repeat(2, 1fr); }
      .action { border-radius: 16px; }
    }

    </div>
    <div class="tool-group" role="group" aria-label="지우개 크기">
     <span class="tool-label canva-text">지우개 크기</span><button id="eraser-small" class="tool selected canva-button" type="button" aria-pressed="true">작은 지우개</button><button id="eraser-large" class="tool canva-button" type="button" aria-pressed="false">큰 지우개</button>
    </div>
   </div>
   <div id="rewrite-confirm" class="confirm-box hidden canva-panel" role="group" aria-label="다시 쓰기 확인">
    <span class="canva-text">현재 글씨를 모두 지울까요?</span><button id="confirm-clear" class="tool canva-button" type="button">모두 지우기</button><button id="cancel-clear" class="tool canva-button" type="button">취소</button>
   </div>
   <footer id="actions" class="actions canva-footer">
    <button id="previous-button" class="action canva-button hidden" type="button">이전</button> <button id="rewrite-button" class="action canva-button hidden" type="button">다시 쓰기</button> <button id="next-button" class="action next canva-button hidden" type="button">다음</button> <button id="home-button" class="action canva-button hidden" type="button">처음으로</button>
   </footer>
  </main>
  <script>
    (() => {
      const groups = {
        basic: {
          '자음': ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'],
          '모음': ['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'],
          '낱말': ['학교','친구','가족','하늘','바다','사랑','마음','나무','구름','웃음']
        },
        sentence: {
          '속담 따라 쓰기': ['티끌 모아 태산.','가는 말이 고와야 오는 말이 곱다.','백지장도 맞들면 낫다.','시작이 반이다.','고래 싸움에 새우 등 터진다.'],
          '명언 따라 쓰기': ['작은 노력도 모이면 큰 힘이 됩니다.','오늘의 나는 어제보다 자랍니다.','실수해도 다시 시작할 수 있어요.','서로 도우면 더 멀리 갈 수 있어요.','나를 믿고 한 걸음씩 나아가요.'],
          '짧은 문장 따라 쓰기': ['학교에서 새 친구를 만났어요.','친구의 이야기를 잘 들어요.','서로 배려하면 마음이 따뜻해요.','매일 조금씩 노력해요.','내 꿈을 향해 한 걸음 나아가요.']
        }
      };

      const $ = id => document.getElementById(id);
      const canvas = $('writing-canvas');
      const ctx = canvas.getContext('2d');
      let type = null, category = null, index = 0, tool = 'pen';
      let penSize = 'normal', penColor = '#24334a', eraserSize = 'small';
      let strokes = [], active = null; // Ink and eraser marks live only on the transparent canvas.
      let completed = new Set(), toastTimer;
      function hideToast() { clearTimeout(toastTimer); $('star-toast').classList.remove('visible'); }
      function resetProgress() { completed = new Set(); hideToast(); clearWriting(); }
      function updateProgress() {
        const total = groups[type][category].length;
        $('progress').textContent = `${category} · ${index + 1} / ${total}`;
        $('progress-fill').style.width = `${completed.size / total * 100}%`;
        $('progress-track').setAttribute('aria-valuemax', String(total));
        $('progress-track').setAttribute('aria-valuenow', String(completed.size));
        $('star-count').textContent = `⭐ ${Math.floor(completed.size / 5)}`;
        $('star-count').setAttribute('aria-label', `모은 별 ${Math.floor(completed.size / 5)}개`);
      }
      function celebrateStar() {
        hideToast();
        $('star-toast').classList.add('visible');
        toastTimer = setTimeout(hideToast, 3000);
      }

      function show(screen) {
        $('rewrite-confirm').classList.add('hidden');
        ['home-screen','category-screen','practice-screen','celebration'].forEach(id => $(id).classList.toggle('hidden', id !== screen));
        const practicing = screen === 'practice-screen';
        $('tool-row').classList.toggle('hidden', !practicing);
        ['previous-button','rewrite-button','next-button'].forEach(id => $(id).classList.toggle('hidden', !practicing));
        $('home-button').classList.toggle('hidden', screen === 'home-screen' || screen === 'celebration');
        $('actions').classList.toggle('hidden', screen === 'home-screen' || screen === 'celebration');
        $('progress-wrap').classList.toggle('hidden', !practicing);
        if (practicing) requestAnimationFrame(sizeCanvas);
      }

      function setTool(value) {
        tool = value;
        $('pen-button').classList.toggle('selected', value === 'pen');
        $('eraser-button').classList.toggle('selected', value === 'eraser');
        $('pen-button').setAttribute('aria-pressed', String(value === 'pen'));
        $('eraser-button').setAttribute('aria-pressed', String(value === 'eraser'));
        canvas.style.cursor = value === 'eraser' ? 'cell' : 'crosshair';
      }

      function selectOption(ids, chosen) {
        ids.forEach(id => {
          const button = $(id);
          button.classList.toggle('selected', id === chosen);
          button.setAttribute('aria-pressed', String(id === chosen));
        });
      }

      function clearWriting() {
        active = null;
        strokes = [];
        redraw();
      }

      function openCategory(value) {
        type = value;
        $('category-title').textContent = value === 'basic' ? '기초 글씨 연습' : '문장 글씨 연습';
        const choices = $('category-choices');
        choices.replaceChildren();
        Object.keys(groups[value]).forEach(name => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'choice canva-button';
          button.textContent = name;
          button.addEventListener('click', () => {
            category = name;
            index = 0;
            resetProgress();
            renderPractice();
          });
          choices.appendChild(button);
        });
        show('category-screen');
      }

      function renderPractice() {
        clearWriting();
        const items = groups[type][category];
        const sentence = type === 'sentence';
        updateProgress();
        $('previous-button').disabled = index === 0;
        $('guide-character').textContent = sentence ? '' : items[index];
        $('guide-character').classList.toggle('word', !sentence && items[index].length > 1);
        $('sentence-prompt').textContent = sentence ? items[index] : '';
        $('sentence-prompt').classList.toggle('hidden', !sentence);
        $('practice-area').classList.toggle('sentence', sentence);
        show('practice-screen');
      }

      function sizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        redraw();
      }

      function point(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: (event.clientX - rect.left) / rect.width, y: (event.clientY - rect.top) / rect.height };
      }

      function drawStroke(mark) {
        const w = canvas.clientWidth, h = canvas.clientHeight;
        const points = mark.points;
        if (!points.length) return;
        ctx.save();
        ctx.globalCompositeOperation = mark.kind === 'eraser' ? 'destination-out' : 'source-over';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = mark.kind === 'eraser' ? '#000' : mark.color;
        ctx.fillStyle = ctx.strokeStyle;
        ctx.lineWidth = mark.width;
        if (points.length === 1 || (points.length === 2 && Math.hypot((points[1].x - points[0].x) * w, (points[1].y - points[0].y) * h) < 0.5)) {
          ctx.beginPath();
          ctx.arc(points[0].x * w, points[0].y * h, mark.width / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(points[0].x * w, points[0].y * h);
          for (let i = 1; i < points.length - 1; i++) {
            ctx.quadraticCurveTo(points[i].x * w, points[i].y * h, (points[i].x + points[i + 1].x) * w / 2, (points[i].y + points[i + 1].y) * h / 2);
          }
          const last = points[points.length - 1];
          ctx.lineTo(last.x * w, last.y * h);
          ctx.stroke();
        }
        ctx.restore();
      }

      function redraw() {
        ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
        strokes.forEach(drawStroke);
      }

      canvas.addEventListener('pointerdown', event => {
        if (active) return;
        event.preventDefault();
        canvas.setPointerCapture(event.pointerId);
        const mark = { kind: tool, color: penColor, width: tool === 'pen' ? {thin: 5, normal: 10, thick: 17}[penSize] : {small: 24, large: 48}[eraserSize], points: [point(event)] };
        active = { id: event.pointerId, mark };
        strokes.push(mark);
        drawStroke(mark);
      });
      canvas.addEventListener('pointermove', event => {
        if (!active || event.pointerId !== active.id) return;
        event.preventDefault();
        const events = event.getCoalescedEvents ? event.getCoalescedEvents() : [event];
        for (const sample of events) {
          const p = point(sample);
          const points = active.mark.points;
          const last = points[points.length - 1];
          if (Math.hypot((p.x - last.x) * canvas.clientWidth, (p.y - last.y) * canvas.clientHeight) > 0.5) points.push(p);
        }
        redraw();
      });
      function finish(event) {
        if (active && event.pointerId === active.id) {
          event.preventDefault();
          const p = point(event);
          active.mark.points.push(p);
          redraw();
          active = null;
        }
      }
      canvas.addEventListener('pointerup', finish);
      canvas.addEventListener('pointercancel', finish);

      $('basic-choice').addEventListener('click', () => openCategory('basic'));
      $('sentence-choice').addEventListener('click', () => openCategory('sentence'));
      $('pen-button').addEventListener('click', () => setTool('pen'));
      $('eraser-button').addEventListener('click', () => setTool('eraser'));
      [['thin','pen-thin'], ['normal','pen-normal'], ['thick','pen-thick']].forEach(([value, id]) => $(id).addEventListener('click', () => {
        penSize = value;
        selectOption(['pen-thin','pen-normal','pen-thick'], id);
        setTool('pen');
      }));
      [['#24334a','color-black'], ['#3265d9','color-blue'], ['#25805a','color-green']].forEach(([value, id]) => $(id).addEventListener('click', () => {
        penColor = value;
        selectOption(['color-black','color-blue','color-green'], id);
        setTool('pen');
      }));
      [['small','eraser-small'], ['large','eraser-large']].forEach(([value, id]) => $(id).addEventListener('click', () => {
        eraserSize = value;
        selectOption(['eraser-small','eraser-large'], id);
        setTool('eraser');
      }));
      $('rewrite-button').addEventListener('click', () => { $('rewrite-confirm').classList.remove('hidden'); $('confirm-clear').focus(); });
      $('confirm-clear').addEventListener('click', () => { clearWriting(); $('rewrite-confirm').classList.add('hidden'); $('rewrite-button').focus(); });
      $('cancel-clear').addEventListener('click', () => { $('rewrite-confirm').classList.add('hidden'); $('rewrite-button').focus(); });
      $('previous-button').addEventListener('click', () => {
        if (index > 0) { index--; renderPractice(); }
      });
      $('next-button').addEventListener('click', () => {
        const before = completed.size;
        completed.add(index);
        clearWriting();
        if (completed.size === groups[type][category].length) {
          $('completion-stats').textContent = `완료한 연습 ${completed.size}개 · 모은 별 ⭐ ${Math.floor(completed.size / 5)}개`;
          show('celebration');
          if (completed.size > before && completed.size % 5 === 0) celebrateStar();
          $('repeat-button').focus();
        } else {
          if (index + 1 < groups[type][category].length) index++;
          renderPractice();
          if (completed.size > before && completed.size % 5 === 0) celebrateStar();
        }
      });
      function goHome() {
        resetProgress();
        type = null;
        category = null;
        index = 0;
        setTool('pen');
        show('home-screen');
      }
      $('home-button').addEventListener('click', goHome);
      $('completion-home-button').addEventListener('click', goHome);
      $('repeat-button').addEventListener('click', () => { resetProgress(); index = 0; renderPractice(); });
      new ResizeObserver(sizeCanvas).observe(canvas);
      show('home-screen');
    })();
  </script>
 </body>
</html>
